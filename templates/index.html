<h2 style="text-align:center; margin-top:40px;">Product Recommendation</h2>

<form method="POST" style="
    max-width:450px;
    margin:30px auto;
    padding:25px;
    border:1px solid #ccc;
    border-radius:10px;
    background:#f9f9f9;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
">

  <label style="font-weight:bold;">Community</label><br>
  <input name="community" placeholder="e.g. hindu" style="
      width:100%;
      padding:8px;
      margin-top:5px;
  "><br><br>

  <label style="font-weight:bold;">Category</label><br>
  <input name="category" placeholder="e.g. saree" style="
      width:100%;
      padding:8px;
      margin-top:5px;
  "><br><br>

  <label style="font-weight:bold;">Min Price</label><br>
  <input name="min_price" type="number" placeholder="optional" style="
      width:100%;
      padding:8px;
      margin-top:5px;
  "><br><br>

  <label style="font-weight:bold;">Max Price</label><br>
  <input name="max_price" type="number" placeholder="optional" style="
      width:100%;
      padding:8px;
      margin-top:5px;
  "><br><br>

  <button type="submit" style="
      width:100%;
      padding:10px;
      background:#007bff;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      font-size:16px;
  ">
    Get Recommendations
  </button>

</form>

<h2 style="text-align:center; margin-top:50px;">Image Category Classifier</h2>

<form method="POST" action="/classify" enctype="multipart/form-data" style="
    max-width:450px;
    margin:30px auto;
    padding:25px;
    border:1px solid #ccc;
    border-radius:10px;
    background:#f9f9f9;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
">

  <label style="font-weight:bold;">Upload Product Image</label><br><br>

  <input type="file" name="image" required style="width:100%;"><br><br>

  <button type="submit" style="
      width:100%;
      padding:10px;
      background:#6f42c1;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      font-size:16px;
  ">
    Classify Category
  </button>

</form>
